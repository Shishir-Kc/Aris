# Aris kitty defaults (package-managed). Override in ~/.config/kitty/kitty.conf

font_family      JetBrainsMono Nerd Font
font_size        11.0

window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no
background_opacity 0.94
cursor_shape beam
shell_integration enabled
tab_bar_style powerline

# Aris palette
foreground            #e4e7ef
background            #0d0f14
selection_foreground  #e4e7ef
selection_background  #2a2e3d
cursor                #9d8cff
cursor_text_color     #0d0f14
url_color             #5ce1c6
active_border_color   #9d8cff
inactive_border_color #2a2e3d
active_tab_foreground   #0d0f14
active_tab_background   #9d8cff
inactive_tab_foreground #8a91a5
inactive_tab_background #151821

color0  #1e2230
color8  #4a5065
color1  #ff6b81
color9  #ff8fa0
color2  #7ee08a
color10 #a3f0ac
color3  #f5c26b
color11 #ffd58f
color4  #8aa8ff
color12 #a9c0ff
color5  #9d8cff
color13 #b9adff
color6  #5ce1c6
color14 #8ff0dc
color7  #c3c8d6
color15 #e4e7ef
