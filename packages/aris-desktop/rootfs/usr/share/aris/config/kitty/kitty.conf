# Aris kitty defaults (package-managed). Override in ~/.config/kitty/kitty.conf

font_family      JetBrainsMono Nerd Font
font_size        11.0

window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no
background_opacity 0.94
cursor_shape beam
shell_integration enabled
tab_bar_style powerline

# Aris palette: black, grey and milky white. The 16 terminal colours keep a
# faint, desaturated hue so diffs, ls and compiler output stay readable.
foreground            #ece8e1
background            #0b0b0b
selection_foreground  #0b0b0b
selection_background  #bcb8b0
cursor                #ece8e1
cursor_text_color     #0b0b0b
url_color             #bcb8b0
active_border_color   #ece8e1
inactive_border_color #2a2a2a
active_tab_foreground   #0b0b0b
active_tab_background   #ece8e1
inactive_tab_foreground #8a8a8a
inactive_tab_background #1b1b1b

color0  #1b1b1b
color8  #4a4a4a
color1  #c98a84
color9  #d9a29c
color2  #a3b49a
color10 #b8c7ae
color3  #cdbb94
color11 #ddcea9
color4  #9aa5b4
color12 #b0bac7
color5  #b3a7a3
color13 #c6bcb8
color6  #a2b0ad
color14 #b8c4c1
color7  #bcb8b0
color15 #ece8e1
