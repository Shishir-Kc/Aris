# Aris lock screen defaults (package-managed).
# Override in ~/.config/hypr/hyprlock.conf after its `source =` line.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = Inter
    color = rgba(228, 231, 239, 1.0)
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = Inter
    color = rgba(138, 145, 165, 1.0)
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    outer_color = rgba(9d8cffee) rgba(5ce1c6ee) 45deg
    inner_color = rgba(21, 24, 33, 0.85)
    font_color = rgb(228, 231, 239)
    check_color = rgba(5ce1c6ee)
    fail_color = rgba(ff6b81ee)
    fade_on_empty = false
    rounding = 12
    font_family = Inter
    placeholder_text = <i>Password</i>
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}
