# Aris prompt (package-managed). Create ~/.config/starship.toml to replace it.
add_newline = false
format = "$directory$git_branch$git_status$python$nodejs$rust$cmd_duration$line_break$character"

[character]
success_symbol = "[❯](bold #ece8e1)"
error_symbol = "[❯](bold #c98a84)"

[directory]
style = "bold #ece8e1"
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "#bcb8b0"
format = "[$symbol$branch]($style) "

[git_status]
style = "#8a8a8a"

[cmd_duration]
style = "#8a8a8a"
format = "[$duration]($style) "
