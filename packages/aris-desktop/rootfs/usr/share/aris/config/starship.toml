# Aris prompt (package-managed). Create ~/.config/starship.toml to replace it.
add_newline = false
format = "$directory$git_branch$git_status$python$nodejs$rust$cmd_duration$line_break$character"

[character]
success_symbol = "[❯](bold #9d8cff)"
error_symbol = "[❯](bold #ff6b81)"

[directory]
style = "bold #5ce1c6"
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "#9d8cff"
format = "[$symbol$branch]($style) "

[git_status]
style = "#f5c26b"

[cmd_duration]
style = "#8a91a5"
format = "[$duration]($style) "
