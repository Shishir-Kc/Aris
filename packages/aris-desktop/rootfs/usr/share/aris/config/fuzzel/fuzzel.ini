# Aris fuzzel defaults (package-managed). Override in ~/.config/fuzzel/fuzzel.ini

[main]
font=Inter:size=12
prompt="❯ "
terminal=kitty -e
icon-theme=Papirus-Dark
layer=overlay
width=42
lines=10
horizontal-pad=20
vertical-pad=14
inner-pad=8

[colors]
background=0d0f14ee
text=e4e7efff
prompt=9d8cffff
placeholder=8a91a5ff
input=e4e7efff
match=5ce1c6ff
selection=2a2e3dff
selection-text=ffffffff
selection-match=5ce1c6ff
border=9d8cffcc

[border]
width=2
radius=12
