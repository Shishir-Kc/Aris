LABEL aris
TEXT HELP
Start the Aris live desktop (Hyprland). Install from the welcome window.
ENDTEXT
MENU LABEL Aris live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL aristext
TEXT HELP
No graphical session: a root console where 'aris-install' still works.
Use this if the desktop does not start on your graphics card.
ENDTEXT
MENU LABEL Aris live, text mode / safe graphics (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset systemd.unit=multi-user.target %KERNEL_PARAMS%
