# Build-time pacman configuration for mkarchiso. Placeholders are replaced by
# scripts/build-iso.sh in a staged copy of the profile.
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 8
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Aris packages, built locally by scripts/build-packages.sh (unsigned).
[aris]
SigLevel = Optional TrustAll
Server = file://@ARIS_REPO@

[core]
Include = @MIRRORLIST@

[extra]
Include = @MIRRORLIST@
